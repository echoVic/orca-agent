[workspace]
members = [".", "crates/*"]
default-members = [".", "crates/*"]
resolver = "3"

[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
clap = { version = "4.5.50", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "v7"] }
tokio = { version = "1.48", features = ["rt-multi-thread", "macros", "process", "io-util", "io-std", "net", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
async-trait = "0.1"
futures = { version = "0.3", default-features = false }
agent-client-protocol = { version = "=0.10.4", features = ["unstable"] }
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "hickory-dns", "json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
hickory-resolver = "0.25.2"
toml = "0.8"
tiktoken-rs = "0.12.0"
dirs = "6"
globset = "0.4"
walkdir = "2"
ignore = "0.4"
regex = "1"
nucleo = { git = "https://github.com/helix-editor/nucleo.git", rev = "8c16d47cdfa9607d3e44df5f81c635c6f43c65ee" }
crossbeam-channel = "0.5"
crossterm = "0.28"
ratatui = "0.29"
ratatui-image = { version = "=9.0.0", default-features = false, features = ["crossterm"] }
tui-textarea = "0.7"
qwertty = { version = "=0.1.6", features = ["tokio"] }
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
shlex = "1.3"
url = "2"
supports-color = "3.0.2"
pulldown-cmark = { version = "0.12", default-features = false }
unicode-segmentation = "1.13.3"
unicode-width = "0.2.0"
zstd = "0.13"
similar = "3.1.1"
tempfile = "3.27.0"
sha2 = "0.10"
base64 = "0.22"
syntect = { version = "5.3", default-features = false, features = ["default-syntaxes", "dump-load", "parsing", "regex-fancy"] }
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
libc = "0.2"
landlock = "0.4.5"
seccompiler = "0.5.0"
windows-sys = "0.61"
arboard = { version = "3", features = ["wayland-data-control"] }

[package]
name = "blade-deepseek"
version = "0.4.1"
edition = "2024"
description = "Orca: a DeepSeek-native coding agent"
license = "MIT"
repository = "https://github.com/echoVic/orca-agent"
default-run = "orca"

[[bin]]
name = "orca"
path = "src/main.rs"

[dependencies]
orca-core = { path = "crates/orca-core" }
orca-runtime = { path = "crates/orca-runtime" }
orca-tui = { path = "crates/orca-tui" }
clap = { workspace = true }

[dev-dependencies]
orca-approval = { path = "crates/orca-approval" }
orca-mcp = { path = "crates/orca-mcp", features = ["test-utils"] }
orca-platform = { path = "crates/orca-platform" }
orca-provider = { path = "crates/orca-provider" }
orca-tools = { path = "crates/orca-tools" }
tempfile = { workspace = true }
base64 = { workspace = true }
crossterm = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
uuid = { workspace = true }

[target.'cfg(windows)'.dev-dependencies]
orca-windows-sandbox = { path = "crates/orca-windows-sandbox" }
