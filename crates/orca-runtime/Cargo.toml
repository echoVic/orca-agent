[package]
name = "orca-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
orca-core = { path = "../orca-core" }
orca-file-search = { path = "../orca-file-search" }
orca-mcp = { path = "../orca-mcp" }
orca-tools = { path = "../orca-tools" }
orca-provider = { path = "../orca-provider" }
orca-approval = { path = "../orca-approval" }
orca-platform = { path = "../orca-platform" }
orca-windows-sandbox = { path = "../orca-windows-sandbox" }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
zstd = { workspace = true }
reqwest = { workspace = true }
rusqlite = { workspace = true }
hickory-resolver = { workspace = true }
tokio = { workspace = true, features = ["signal"] }
sha2 = { workspace = true }
ring = { workspace = true }
base64 = { workspace = true }
globset = { workspace = true }
nucleo = { workspace = true }
walkdir = { workspace = true }
crossbeam-channel = { workspace = true }
libc = { workspace = true }
tokio-util = { workspace = true }
async-trait = { workspace = true }
agent-client-protocol = { workspace = true }
futures = { workspace = true }
tempfile = { workspace = true }

[dev-dependencies]
# toml 0.8 is the TOML library of the releases up to v0.5.7. An older Orca on the same
# machine reads the files this one writes, so the `with_toml_0_8` tests parse them with it.
toml_v08 = { package = "toml", version = "0.8" }
orca-core = { path = "../orca-core", features = ["test-utils"] }
orca-mcp = { path = "../orca-mcp", features = ["test-utils"] }
