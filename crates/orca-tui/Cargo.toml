[package]
name = "orca-tui"
version = "0.1.0"
edition = "2024"

[lib]
doctest = false

[dependencies]
orca-core = { path = "../orca-core" }
orca-platform = { path = "../orca-platform" }
orca-mcp = { path = "../orca-mcp" }
orca-tools = { path = "../orca-tools" }
orca-approval = { path = "../orca-approval" }
orca-runtime = { path = "../orca-runtime" }
orca-file-search = { path = "../orca-file-search" }
base64 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
ratatui = { workspace = true, features = ["scrolling-regions", "unstable-rendered-line-info"] }
ratatui-image = { workspace = true }
crossterm = { workspace = true }
tui-textarea = { workspace = true }
qwertty = { workspace = true }
image = { workspace = true }
shlex = { workspace = true }
url = { workspace = true }
supports-color = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
pulldown-cmark = { workspace = true }
unicode-segmentation = { workspace = true }
unicode-width = { workspace = true }
dirs = { workspace = true }
crossbeam-channel = { workspace = true }
syntect = { workspace = true }
two-face = { workspace = true }
similar = { workspace = true, features = ["inline"] }
libc = { workspace = true }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
arboard = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
] }

[dev-dependencies]
tempfile = { workspace = true }
chrono = { workspace = true }
